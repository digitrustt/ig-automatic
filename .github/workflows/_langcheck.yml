name: _langcheck
on:
  push:
    paths: [.github/workflows/_langcheck.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pipx install yt-dlp >/dev/null 2>&1 || pip install -q yt-dlp
      - name: Do titles come back Polish or auto-translated?
        run: |
          U=https://www.youtube.com/@dresscodecrew/videos
          echo "--- bez flagi ---"
          yt-dlp --flat-playlist --playlist-end 3 --print '%(title)s' --no-warnings "$U" || true
          echo "--- lang=pl ---"
          yt-dlp --flat-playlist --playlist-end 3 --print '%(title)s' --no-warnings \
            --extractor-args "youtube:lang=pl" "$U" || echo "FLAGA ODRZUCONA"
          echo "--- lang=original ---"
          yt-dlp --flat-playlist --playlist-end 3 --print '%(title)s' --no-warnings \
            --extractor-args "youtube:lang=original" "$U" || echo "FLAGA ODRZUCONA"
