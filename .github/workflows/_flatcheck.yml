name: _flatcheck
on:
  push:
    paths: [.github/workflows/_flatcheck.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yt-dlp
      - name: Does a flat playlist listing carry duration?
        run: |
          echo "=== PLAYLISTA ==="
          yt-dlp --flat-playlist --playlist-end 3 --no-warnings \
            --print '%(.{id,title,duration,view_count})j' \
            "https://www.youtube.com/playlist?list=PLoWDh9ssiTk12ARYvNSCAwPu4tDKJXlLk" || true
          echo "=== KANAL (dla porownania) ==="
          yt-dlp --flat-playlist --playlist-end 3 --no-warnings \
            --print '%(.{id,title,duration,view_count})j' \
            "https://www.youtube.com/@dresscodecrew/videos" || true
