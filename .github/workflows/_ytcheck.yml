name: _ytcheck
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python3 -m pip install --upgrade --quiet yt-dlp
      - name: List formats
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/c.txt"
          yt-dlp --cookies "$RUNNER_TEMP/c.txt" --list-formats \
            "https://www.youtube.com/watch?v=cfUl6dfiqyY" 2>&1 | tail -40 || true
      - name: Try simple format
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          yt-dlp --cookies "$RUNNER_TEMP/c.txt" \
            --download-sections "*00:05:00-00:05:20" --force-keyframes-at-cuts \
            -f "best[height<=720]/best" --merge-output-format mp4 \
            -o out.mp4 "https://www.youtube.com/watch?v=cfUl6dfiqyY" 2>&1 | tail -15
          ls -la out.mp4 || true
