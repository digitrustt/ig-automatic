name: _ytcheck
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python3 -m pip install --upgrade --quiet yt-dlp
      - name: Metadata
        run: yt-dlp --flat-playlist --playlist-end 2 --print "%(id)s %(duration)s" "https://www.youtube.com/@ksiazulo/videos"
      - name: Download a 20s section
        run: |
          yt-dlp --download-sections "*00:05:00-00:05:20" --force-keyframes-at-cuts \
            -f "bv*[height<=720]+ba/b[height<=720]" --merge-output-format mp4 \
            -o out.mp4 "https://www.youtube.com/watch?v=cfUl6dfiqyY"
          ls -la out.mp4
