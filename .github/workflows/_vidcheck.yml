name: _vidcheck
on:
  push:
    paths: [.github/workflows/_vidcheck.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yt-dlp && curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null
      - name: Provide YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          chmod 600 "$RUNNER_TEMP/cookies.txt"
      - name: Which invocation resolves a single video?
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          V=https://www.youtube.com/watch?v=XYagXxNA3Ng
          P='%(.{id,title,duration})j'
          echo "=== A: tak jak teraz (flat, bez ciasteczek) ==="
          yt-dlp --flat-playlist --playlist-end 1 --print "$P" --no-warnings "$V" 2>&1 | tail -3 || true
          echo "=== B: flat + ciasteczka ==="
          yt-dlp --flat-playlist --playlist-end 1 --print "$P" --no-warnings --cookies "$RUNNER_TEMP/cookies.txt" "$V" 2>&1 | tail -3 || true
          echo "=== C: bez flat, z ciasteczkami i solverem ==="
          yt-dlp --print "$P" --no-warnings --skip-download --cookies "$RUNNER_TEMP/cookies.txt" --remote-components ejs:github "$V" 2>&1 | tail -3 || true
          echo "=== D: bez flat, bez ciasteczek ==="
          yt-dlp --print "$P" --no-warnings --skip-download "$V" 2>&1 | tail -3 || true
