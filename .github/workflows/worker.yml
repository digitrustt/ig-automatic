name: worker

# The runner is the whole compute layer. Each run drains the queue and exits
# rather than idling — there is no server to keep alive.
on:
  schedule:
    # Every half hour. Polling for new videos would be fine far slower —
    # tracked channels publish a few times a week — but publishing is what
    # sets this: slots are two hours apart, so a two-hourly worker could miss
    # one by almost its whole width and reschedule a post that was ready.
    #
    # Affordable because the repository is public, and public repositories get
    # unmetered Actions minutes.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# A second run starting mid-render would fight the first over the same jobs.
# The queue's row locks make that safe, but serialising is cheaper.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ffmpeg is NOT preinstalled on ubuntu-latest, despite what its docs
      # imply. Verify with `command -v`, never `ffmpeg -version | head -1`:
      # in a pipeline the exit status comes from head, so that check passes
      # even when ffmpeg is missing and the failure surfaces much later.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg && command -v ffprobe
          ffmpeg -version | head -1

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade --quiet yt-dlp
          yt-dlp --version

      # YouTube gates its media URLs behind a JavaScript challenge. yt-dlp
      # solves it with a JS runtime plus a solver script — Deno is the
      # supported runtime, and the script is fetched via --remote-components
      # (see the flag in lib/youtube/ytdlp.ts). Node alone is not enough.
      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Verify Deno
        run: deno --version | head -1

      # Solving the challenge is necessary but not sufficient: datacenter
      # addresses also get a "confirm you're not a bot" gate, and only a
      # logged-in session clears it. Written to the runner temp dir, which
      # dies with the machine, and never into the workspace.
      - name: Provide YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        if: ${{ env.YOUTUBE_COOKIES != '' }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          chmod 600 "$RUNNER_TEMP/cookies.txt"
          echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"

      - name: Drain the queue
        env:
          WORKER_MODE: batch
          WORKER_ID: gha-${{ github.run_id }}
          # Under the job timeout, so a long clipping run exits cleanly
          # rather than being killed mid-upload.
          MAX_BATCH_MS: '2400000'

          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          COPY_PROVIDER: cloud
          COPY_LANGUAGE: ${{ vars.COPY_LANGUAGE || 'Polish' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TRANSCRIBE_LANGUAGE: ${{ vars.TRANSCRIBE_LANGUAGE || 'pl' }}

          POSTING_HOURS: ${{ vars.POSTING_HOURS || '11,17,20' }}
          # Clipping campaign: the sponsor mark burned into every clip and the
          # credit the campaign requires. Clear both variables to stop running it.
          CAMPAIGN_LOGO: ${{ vars.CAMPAIGN_LOGO }}
          CAMPAIGN_MENTION: ${{ vars.CAMPAIGN_MENTION }}
          # drawtext needs the file, libass needs the family name.
          FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          CAPTION_FONT: DejaVu Sans
        run: npm run worker:prod
